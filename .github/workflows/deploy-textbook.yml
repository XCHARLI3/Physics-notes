name: Deploy Physics Notes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MkDocs Material
        run: pip install "mkdocs-material>=9,<10"
      - name: Build the electromagnetism website
        run: mkdocs build --strict --config-file mkdocs.yml
      - name: Prepare the Green functions website
        run: |
          mkdir -p build/green-functions-docs/assets/javascripts
          cp "Green functions - Harmonic Oscillator to Convolution/Green functions - Harmonic Oscillator to Convolution.md" build/green-functions-docs/index.md
          cp "Fundamentals of Electromagnetism/assets/javascripts/katex.js" build/green-functions-docs/assets/javascripts/katex.js
      - name: Build the Green functions website
        run: mkdocs build --strict --config-file mkdocs-green-functions.yml
      - name: Verify both independent websites
        run: |
          test -f site/index.html
          test -f site/search/search_index.json
          test -f site/green-functions/index.html
          test -f site/green-functions/search/search_index.json
          test -f site/green-functions/assets/javascripts/katex.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
